# ShowMe: the Linux (Rust) port of DigUp. The Swift package next to it stays until the port catches up.
[workspace]
resolver = "3"
members = ["crates/llama-sys", "crates/showme-core", "crates/showme-embed", "crates/showme", "crates/showme-panel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Simen1331/ShowMe"
