# ShowMe in Hyprland: add to ~/.config/hypr/bindings.conf (or hyprland.conf). Pick a key that's free:
# `hyprctl binds | grep -i -A3 "key: d"` shows what a key does now.
bindd = SUPER, D, ShowMe, exec, showme-panel --toggle

# The panel is an overlay (layer shell): blur behind it, as behind Walker.
layerrule = blur, showme
layerrule = ignorezero, showme

# The big search window (Ctrl+O in the panel) floats.
windowrule = float, class:^(dev.showme.Panel)$
windowrule = size 1280 820, class:^(dev.showme.Panel)$
