# Digger in Hyprland: add to ~/.config/hypr/bindings.conf (or hyprland.conf). Pick a key that's free:
# `hyprctl binds | grep -i -A3 "key: d"` shows what a key does now.
bind = SUPER, D, exec, digger-panel --toggle

# The panel is an overlay (layer shell): blur behind it, as behind Walker.
layerrule = blur, digger
layerrule = ignorezero, digger

# The big search window (Ctrl+O in the panel) floats.
windowrule = float, class:^(dev.digger.Panel)$
windowrule = size 1280 820, class:^(dev.digger.Panel)$
