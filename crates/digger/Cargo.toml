[package]
name = "digger"
description = "Search your files by what's in them, with EmbeddingGemma 2"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
vulkan = ["digger-embed/vulkan"]
cuda = ["digger-embed/cuda"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
digger-core = { path = "../digger-core" }
digger-embed = { path = "../digger-embed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
