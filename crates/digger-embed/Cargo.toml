[package]
name = "digger-embed"
description = "EmbeddingGemma 2 on llama.cpp: Digger's embedder"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
vulkan = ["llama-sys/vulkan"]
cuda = ["llama-sys/cuda"]

[dependencies]
digger-core = { path = "../digger-core" }
llama-sys = { path = "../llama-sys" }
sha2 = "0.11"
ureq = "3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
